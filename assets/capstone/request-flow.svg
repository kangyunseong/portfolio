<svg xmlns="http://www.w3.org/2000/svg" width="720" height="740" viewBox="0 0 720 740" role="img" aria-labelledby="title desc"><style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#172b45}.title{font-size:26px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:16px;fill:#455b73}.box{fill:#f4f7fb;stroke:#c6d4e3;stroke-width:1.5}.line{stroke:#527ba5;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527ba5"/></marker></defs><rect width="720" height="740" fill="#fff"/><title id="title">상담 요청 처리 구조</title><desc id="desc">JWT와 세션 소유권을 확인하고 사용자 메시지를 추가한 뒤 시나리오 또는 모델 응답을 생성하여 대화를 저장합니다. 학습 완료를 의미하는 도식은 아닙니다.</desc>
<text x="36" y="48" class="title">상담 요청에서 대화 저장까지</text><text x="36" y="78" class="small">소스 흐름 설명도 · 실제 실행 화면 아님</text>
<rect x="40" y="105" width="640" height="75" rx="10" class="box"/><text x="64" y="135" class="head">1. 인증과 소유권</text><text x="64" y="162" class="small">JWT 사용자 확인 → session_id + user_id 조회</text><path d="M360 180 V207" class="line"/>
<rect x="40" y="212" width="640" height="75" rx="10" class="box"/><text x="64" y="242" class="head">2. 사용자 메시지 추가</text><text x="64" y="269" class="small">DB 세션에 추가·flush → 응답 서비스 호출</text><path d="M360 287 V317" class="line"/>
<rect x="40" y="322" width="640" height="190" rx="10" class="box"/><text x="64" y="354" class="head">3. 응답 경로 선택</text>
<rect x="64" y="374" width="254" height="108" rx="8" fill="#e7f0fa"/><text x="84" y="408" class="head">시나리오 해당</text><text x="84" y="439" class="small">키워드·단계별 안내</text>
<rect x="338" y="374" width="318" height="108" rx="8" fill="#e7f0fa"/><text x="358" y="408" class="head">그 외: 추론 함수</text><text x="358" y="439" class="small">지연 로딩 → 모델 응답</text><text x="358" y="466" class="small">로딩 실패 → 고정 fallback</text><path d="M360 512 V540" class="line"/>
<rect x="40" y="545" width="640" height="90" rx="10" class="box"/><text x="64" y="577" class="head">4. 응답 저장과 반환</text><text x="64" y="606" class="small">어시스턴트 메시지·응답 시간 기록 → commit</text>
<text x="40" y="681" class="small">전체 백엔드는 비공개 · 공개 샘플은 응답 서비스 1개 파일</text><text x="40" y="708" class="small">시나리오 응답과 fallback은 모델 성능의 증거가 아닙니다.</text></svg>
