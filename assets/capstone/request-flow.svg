<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">인증·인가·저장을 연결하는 상담 요청 흐름</title><desc id="desc">비공개 소스 검토를 바탕으로 새로 작성한 설명도. 인증 또는 소유권 확인에 실패하면 중단하고, 정상 경로에서는 사용자 메시지 준비, 응답 생성, 저장 확정 후 반환합니다.</desc><style>text{font-family:Malgun Gothic,sans-serif;fill:#172b45}.h{font-size:24px;font-weight:700}.t{font-size:20px}.s{font-size:18px;fill:#455b73}</style><rect width="600" height="1000" fill="white"/><text x="28" y="42" class="h">상담 요청의 권한과 저장 경계</text><text x="28" y="73" class="s">구현 흐름 설명도 · 실제 실행 결과 아님</text>
<rect x="28" y="100" width="544" height="112" rx="10" fill="#f4f7fb" stroke="#c6d4e3"/><text x="46" y="132" class="h">1. JWT 인증</text><text x="46" y="164" class="t">토큰 해석 · 사용자 조회</text><text x="46" y="194" class="s">실패 시 401 → 중단</text>
<path d="M300 214 v16 m-5 -5 5 5 5 -5" fill="none" stroke="#527ba5" stroke-width="2"/>
<rect x="28" y="237" width="544" height="112" rx="10" fill="#f4f7fb" stroke="#c6d4e3"/><text x="46" y="269" class="h">2. 세션 소유권 확인</text><text x="46" y="301" class="t">session_id + 현재 user_id 조회</text><text x="46" y="331" class="s">일치하는 세션 없음 → 404 · 중단</text>
<path d="M300 351 v16 m-5 -5 5 5 5 -5" fill="none" stroke="#527ba5" stroke-width="2"/>
<rect x="28" y="374" width="544" height="112" rx="10" fill="#f4f7fb" stroke="#c6d4e3"/><text x="46" y="406" class="h">3. 사용자 메시지 준비</text><text x="46" y="438" class="t">DB add / flush</text><text x="46" y="468" class="s">flush는 저장 확정(commit)이 아님</text>
<path d="M300 488 v16 m-5 -5 5 5 5 -5" fill="none" stroke="#527ba5" stroke-width="2"/>
<rect x="28" y="511" width="544" height="112" rx="10" fill="#f4f7fb" stroke="#c6d4e3"/><text x="46" y="543" class="h">4. 응답 서비스 호출</text><text x="46" y="575" class="t">시나리오 우선 → 그 외 추론 함수</text><text x="46" y="605" class="s">모델 로딩 실패 → 고정 fallback</text>
<path d="M300 625 v16 m-5 -5 5 5 5 -5" fill="none" stroke="#527ba5" stroke-width="2"/>
<rect x="28" y="648" width="544" height="112" rx="10" fill="#f4f7fb" stroke="#c6d4e3"/><text x="46" y="680" class="h">5. 대화 저장 확정</text><text x="46" y="712" class="t">응답 메시지 · 세션 갱신 시간 기록</text><text x="46" y="742" class="s">commit → refresh</text>
<path d="M300 762 v16 m-5 -5 5 5 5 -5" fill="none" stroke="#527ba5" stroke-width="2"/>
<rect x="28" y="785" width="544" height="112" rx="10" fill="#f4f7fb" stroke="#c6d4e3"/><text x="46" y="817" class="h">6. API 응답 반환</text><text x="46" y="849" class="t">사용자 메시지 + 어시스턴트 응답</text><text x="46" y="879" class="s">실제 추론 여부는 응답 경로별 확인 필요</text>
<text x="28" y="950" class="s">전체 백엔드 비공개 · 공개 코드는 응답 서비스 1개</text><text x="28" y="978" class="s">생성·저장 실패의 복구 정책은 후속 검증 과제</text></svg>