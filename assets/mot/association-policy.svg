<svg xmlns="http://www.w3.org/2000/svg" width="720" height="740" viewBox="0 0 720 740" role="img" aria-labelledby="title desc"><style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#172b45}.title{font-size:26px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:16px;fill:#455b73}.box{fill:#f4f7fb;stroke:#c6d4e3;stroke-width:1.5}.line{stroke:#527ba5;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527ba5"/></marker></defs><rect width="720" height="740" fill="#fff"/><title id="title">접근·겹침·재분리의 ID 연결 정책</title><desc id="desc">분리 가능한 근접 상태는 교체 제한, 합쳐진 상태는 그룹 처리, 재분리는 여러 관측의 비용을 비교합니다. 실제 추적 결과가 아닌 개념도입니다.</desc>
<text x="36" y="48" class="title">관측 상태에 따라 ID 연결을 판단</text><text x="36" y="78" class="small">정책 설명을 위한 개념도 · 실제 프레임 아님</text>
<rect x="40" y="108" width="640" height="145" rx="10" class="box"/><rect x="76" y="137" width="18" height="84" rx="8" fill="#407caf"/><rect x="126" y="137" width="18" height="84" rx="8" fill="#a86b32"/><text x="184" y="146" class="head">접근 · 두 객체가 분리됨</text><text x="184" y="180" class="small">LOCKED_SAM_UPDATE</text><text x="184" y="212" class="small">위치 갱신 + 성급한 ID 교체 제한</text><path d="M360 253 V279" class="line"/>
<rect x="40" y="284" width="640" height="145" rx="10" class="box"/><rect x="92" y="312" width="40" height="84" rx="10" fill="#7a8290"/><text x="184" y="322" class="head">겹침 · 한 영역으로 관측</text><text x="184" y="356" class="small">GROUP_TRACK</text><text x="184" y="388" class="small">개별 객체를 확정하지 않고 그룹 상태로 관리</text><path d="M360 429 V455" class="line"/>
<rect x="40" y="460" width="640" height="145" rx="10" class="box"/><rect x="76" y="490" width="18" height="84" rx="8" fill="#407caf"/><rect x="126" y="490" width="18" height="84" rx="8" fill="#a86b32"/><text x="184" y="498" class="head">재분리 · 후보와 물리 ID는 별개</text><text x="184" y="532" class="small">복구 관측 창에서 KEEP / SWAP 비교</text><text x="184" y="564" class="small">경로 비용·투표·잠금 조건으로 결정</text>
<text x="40" y="654" class="small">색은 개념 설명용이며 GT 또는 추적 성공을 나타내지 않습니다.</text><text x="40" y="687" class="head">정책 구현 → GT와 비교 → 남은 ID 실패 분석</text><text x="40" y="716" class="small">ID 전환 해결이나 성능 향상을 전제하지 않습니다.</text></svg>
